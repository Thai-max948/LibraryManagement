name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test WPF app
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LibraryManagement.slnx

      - name: Build solution
        run: dotnet build LibraryManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test LibraryManagement.slnx --configuration Release --no-build --no-restore --filter "Category!=Integration"

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create LibraryMgmtCI
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB could not create the CI instance.' }
          sqllocaldb start LibraryMgmtCI
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB failed to start.' }

      - name: Run SQL integration tests
        env:
          LIBRARY_TEST_SQL_MASTER_CONNECTION: 'Server=(localdb)\LibraryMgmtCI;Database=master;Integrated Security=True;Encrypt=False;TrustServerCertificate=True;Connect Timeout=15'
        run: dotnet test LibraryManagement.slnx --configuration Release --no-build --no-restore --filter "Category=Integration"
